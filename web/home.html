<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#18181b" />
  <title>We HR Attendance</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/home.css" />
</head>
<body>
  <header class="topbar app-bar">
    <div class="brand-wrap">
      <div class="brand-logo">We</div>
      <div>
        <h1 class="brand-title">We HR</h1>
        <p class="brand-subtitle" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn btn-outline" id="btn-lang"></button>
      <button type="button" class="btn btn-outline hidden" id="btn-logout" data-i18n="signOut"></button>
    </div>
  </header>

  <main class="app-shell">
    <!-- APP LOADING -->
    <section id="view-loading" class="card loading-card" role="status" aria-live="polite">
      <div class="loading-logo">We</div>
      <div class="loading-spinner" aria-hidden="true"></div>
      <h2 class="loading-title" data-i18n="appLoadingTitle">جارٍ تحميل تطبيق We HR…</h2>
      <p class="muted" data-i18n="appLoadingSubtitle">يرجى الانتظار لحظات…</p>
    </section>

    <!-- SIGN IN (employees, HR staff and platform admins) -->
    <section id="view-login" class="card hidden">
      <h2 data-i18n="loginTitle"></h2>
      <form id="form-login">
        <div class="form-group">
          <label for="login-user" data-i18n="username"></label>
          <input id="login-user" class="form-control" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </div>
        <div class="form-group">
          <label for="login-pass" data-i18n="password"></label>
          <input id="login-pass" type="password" class="form-control" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-signin" data-i18n="signIn"></button>
      </form>
      <div id="login-error" class="alert alert-danger hidden" role="alert"></div>
    </section>

    <!-- EMPLOYEE ATTENDANCE (same screen as the mobile app) -->
    <section id="view-employee" class="hidden">
      <div class="card profile-card">
        <div>
          <div class="profile-name" id="emp-name"></div>
          <div class="muted" id="emp-meta"></div>
        </div>
        <span class="badge" id="emp-state"></span>
      </div>

      <div class="card">
        <p class="muted" data-i18n="locationExplanation"></p>
        <dl class="facts">
          <dt data-i18n="nearestWorkplace"></dt><dd id="loc-workplace">—</dd>
          <dt data-i18n="distance"></dt><dd id="loc-distance">—</dd>
          <dt data-i18n="accuracy"></dt><dd id="loc-accuracy">—</dd>
        </dl>
        <div id="loc-fence" class="badge hidden"></div>
        <button type="button" class="btn btn-secondary btn-block" id="btn-refresh-loc" data-i18n="refreshLocation"></button>
      </div>

      <div class="action-grid">
        <button type="button" class="btn btn-primary btn-lg" data-event="check_in" data-i18n="checkIn"></button>
        <button type="button" class="btn btn-secondary btn-lg" data-event="break_start" data-i18n="breakStart"></button>
        <button type="button" class="btn btn-secondary btn-lg" data-event="break_end" data-i18n="breakEnd"></button>
        <button type="button" class="btn btn-accent btn-lg" data-event="check_out" data-i18n="checkOut"></button>
      </div>

      <div id="status-banner" class="alert hidden" role="status" aria-live="polite"></div>

      <div class="card">
        <h3 class="card-title" data-i18n="recentActivity"></h3>
        <ul class="list-plain" id="recent-events"></ul>
      </div>

      <a class="btn btn-ghost btn-block hidden" id="link-hr" href="/hr" data-i18n="hrDashboard"></a>
    </section>

    <!-- HR staff without an employee profile -->
    <section id="view-no-profile" class="card hidden">
      <p data-i18n="noProfile"></p>
      <a class="btn btn-primary btn-block" href="/hr" id="link-hr-only" data-i18n="hrDashboard"></a>
    </section>
  </main>

  <script src="/native-bridge.js"></script>
  <script src="/home.js"></script>
</body>
</html>
